name: Actualiser les offres
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6,12,18 * * *'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collecter les annonces
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python scripts/collect_offers.py
      - name: Publier les données actualisées
        run: |
          if git diff --quiet -- data/offres.json; then
            echo "Aucune modification"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offres.json
          git commit -m "Actualiser les offres d'emploi"
          git push
